services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clipper
      POSTGRES_PASSWORD: clipper
      POSTGRES_DB: clipper
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipper -d clipper"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes: [postgres-data:/var/lib/postgresql/data]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgres://clipper:clipper@postgres:5432/clipper
      PORT: 3000
      ASSET_DATA_DIR: /data
      MAX_UPLOAD_BYTES: 5000000000
      YOUTUBE_DATA_API_KEY: ${YOUTUBE_DATA_API_KEY:-}
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID:-UCfU4-ArXuSX0tpyApyklMAg}
      YOUTUBE_SYNC_MAX_PAGES: ${YOUTUBE_SYNC_MAX_PAGES:-100}
    ports: ["3000:3000"]
    volumes: [./data:/data]
    depends_on: { postgres: { condition: service_healthy } }
  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    environment: { DATABASE_URL: postgres://clipper:clipper@postgres:5432/clipper, ASSET_DATA_DIR: /data, WORKER_CONCURRENCY: 1, LEASE_SECONDS: 60, RENDER_LEASE_SECONDS: 120, MAX_SOURCE_BYTES: 5000000000, TRANSCRIPTION_PROVIDER: sidecar, SOURCE_PLATFORM_ADAPTER: yt-dlp, YTDLP_BIN: /opt/yt-dlp/bin/yt-dlp, BRAND_LOGO_PATH: /app/assets/brand/axios-logo.png, BRAND_FONT_PATH: /app/assets/brand/NBInternationalPro-Bold.ttf, BRAND_FONT_NAME: NB International Pro Bold, CANDIDATE_MIN_SECONDS: 30, CANDIDATE_MAX_SECONDS: 60, FFMPEG_PRESET: veryfast, FFMPEG_CRF: 20 }
    depends_on: { postgres: { condition: service_healthy } }
    volumes: [./data:/data]
volumes: { postgres-data: {} }
